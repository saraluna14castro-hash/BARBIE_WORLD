
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis mensajitos | Barbie World</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            Barbie<span>World</span> ♡
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="diario.html">Barbie Diary</a>
            <a href="mensajitos.html">Mis mensajitos 💌</a>
            <a href="calendario.html">Calendario 💗</a>
            <a href="index.html#nosotros">Nosotros</a>
        </nav>

        <a href="catalogo.html" class="nav-button">Exploremos ✨</a>
    </header>

    <main>
        <section class="diary-section">
            <div class="diary-container">
                <span class="diary-subtitle">MY SWEET MEMORIES ♡</span>

                <h2>Mis mensajitos guardados 💌</h2>

                <p class="diary-description">
                    Todos esos momentos, pensamientos y recuerdos
                    que quiero conservar en mi pequeño mundo rosa.
                </p>

                <div id="diaryEntries"></div>
            </div>
        </section>
    </main>

    <footer>
        <a href="index.html" class="logo">
            Barbie<span>World</span> ♡
        </a>
        <p>SOÑAR EN GRANDE NUNCA PASA DE MODA ✨</p>
    </footer>

    <script>
        const diaryEntries = document.getElementById("diaryEntries");

        let entries = JSON.parse(
            localStorage.getItem("barbieDiary") || "[]"
        );

        function showEntries() {
            diaryEntries.innerHTML = "";

            if (entries.length === 0) {
                diaryEntries.innerHTML =
                    "<p>Aún no tienes mensajitos guardados. ¡Escribe tu primer recuerdo! 💗</p>";
                return;
            }

            entries.forEach((entry, index) => {
                const card = document.createElement("article");
                card.className = "diary-entry";

                const title = document.createElement("h3");
                title.textContent = "💗 " + entry.title;

                const mood = document.createElement("p");
                mood.textContent = "Mi estado de ánimo: " + entry.mood;

                const date = document.createElement("small");
                date.textContent = entry.date;

                const content = document.createElement("p");
                content.textContent = entry.content;

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.textContent = "Editar ✏️";

                editButton.addEventListener("click", () => {
                    const newTitle = prompt("Nuevo título:", entry.title);
                    if (newTitle === null || !newTitle.trim()) return;

                    const newContent = prompt("Edita tu recuerdo:", entry.content);
                    if (newContent === null || !newContent.trim()) return;

                    entries[index].title = newTitle.trim();
                    entries[index].content = newContent.trim();

                    saveEntries();
                    showEntries();
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.textContent = "Eliminar 🗑️";

                deleteButton.addEventListener("click", () => {
                    if (confirm("¿Quieres eliminar este recuerdo?")) {
                        entries.splice(index, 1);
                        saveEntries();
                        showEntries();
                    }
                });

                card.append(
                    title,
                    mood,
                    date,
                    content,
                    editButton,
                    deleteButton
                );

                diaryEntries.appendChild(card);
            });
        }

        function saveEntries() {
            localStorage.setItem("barbieDiary", JSON.stringify(entries));
        }

        showEntries();
    </script>

</body>
</html>
