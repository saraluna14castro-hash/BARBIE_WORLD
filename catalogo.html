
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | Barbie World</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            Barbie<span>World</span> ♡
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="diario.html">Barbie Diary</a>
            <a href="mensajitos.html">Mis mensajitos 💌</a>
            <a href="calendario.html">Calendario 💗</a>
            <a href="index.html#nosotros">Nosotros</a>
        </nav>

        <a href="catalogo.html" class="nav-button">Exploremos ✨</a>
    </header>

    <main>
        <section class="diary-section">
            <div class="diary-container">

                <span class="diary-subtitle">WELCOME TO MY WORLD ♡</span>

                <h2>Mi catálogo Barbie 💖</h2>

                <p class="diary-description">
                    Descubre series y contenido especial de nuestro mundo rosa.
                </p>

                <input type="text" id="busqueda" placeholder="Busca una serie...">
                <button type="button" id="buscar">Buscar 💗</button>

                <div id="resultados"></div>

            </div>
        </section>
    </main>

    <footer>
        <a href="index.html" class="logo">
            Barbie<span>World</span> ♡
        </a>
        <p>SOÑAR EN GRANDE NUNCA PASA DE MODA ✨</p>
    </footer>

    <script>
        // Catálogo conectado a la API de TVmaze
        const API_URL = "https://api.tvmaze.com/search/shows?q=";
        const resultados = document.getElementById("resultados");
        const buscador = document.getElementById("busqueda");
        const botonBuscar = document.getElementById("buscar");

        async function buscarSeries(termino = "Barbie") {
            resultados.innerHTML = "<p>Buscando contenido...</p>";

            try {
                const respuesta = await fetch(
                    API_URL + encodeURIComponent(termino)
                );

                if (!respuesta.ok) throw new Error("Error de consulta");

                const datos = await respuesta.json();
                resultados.innerHTML = "";

                if (datos.length === 0) {
                    resultados.innerHTML = "<p>No encontramos resultados.</p>";
                    return;
                }

                datos.forEach(elemento => {
                    const serie = elemento.show;
                    const tarjeta = document.createElement("article");
                    tarjeta.className = "resultado-card";

                    const titulo = document.createElement("h3");
                    titulo.textContent = serie.name;

                    const imagen = document.createElement("img");
                    imagen.src = serie.image?.medium ||
                        "https://placehold.co/400x300/FCEEF3/D94F88?text=Barbie+World";
                    imagen.alt = serie.name;
                    imagen.style.maxWidth = "150px";

                    const descripcion = document.createElement("p");
                    descripcion.textContent = (serie.summary || "Sin descripción disponible.")
                        .replace(/<[^>]*>/g, "")
                        .substring(0, 180);

                    tarjeta.append(imagen, titulo, descripcion);
                    resultados.appendChild(tarjeta);
                });

            } catch (error) {
                resultados.innerHTML =
                    "<p>No se pudo cargar el catálogo. Intenta nuevamente.</p>";
                console.error(error);
            }
        }

        botonBuscar.addEventListener("click", () => {
            if (buscador.value.trim()) buscarSeries(buscador.value.trim());
        });

        buscador.addEventListener("keydown", evento => {
            if (evento.key === "Enter") botonBuscar.click();
        });

        buscarSeries("Barbie");
    </script>

</body>
</html>
